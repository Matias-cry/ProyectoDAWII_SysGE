server:
  port: 8082

spring:
  application:
    name: ms-cursos
  datasource:
    url: jdbc:mysql://mysql-db:3306/db_cursos
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    hikari:
      connection-timeout: 60000 # Un minuto de tiempo de espera
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect # Forzamos el dialecto
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    org.springframework.web: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60