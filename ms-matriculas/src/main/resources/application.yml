server:
  port: 8084

spring:
  application:
    name: ms-matriculas
  datasource:
    url: jdbc:mysql://mysql-db:3306/db_matriculas
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.springframework.web: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60